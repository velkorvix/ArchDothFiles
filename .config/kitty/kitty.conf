# Color scheme
include ~/.cache/wal/colors-kitty.conf

# Font settings
font_family JetBrains Mono
bold_font JetBrains Mono Bold
italic_font JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 11.0
adjust_line_height 0
adjust_column_width 0

# Background and transparency (increase opacity for more blur effect)
background_opacity 0.25
background_image none
background_image_layout scaled
background_tint 0.3

# Window settings
confirm_os_window_close 0
window_padding_width 8 15
window_margin_width 0
draw_minimal_borders yes
hide_window_decorations no
window_alert_on_bell yes

# Cursor settings
cursor_shape beam
cursor_trail 1
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0

# Shell and other settings
shell /usr/bin/zsh
enable_graphics yes

# Visual enhancements
sync_to_monitor yes
visual_bell_duration 0.25
focus_follows_mouse no
pointer_shape_when_grabbed arrow

# Tab bar customization
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style angled

# Colors for UI elements
active_tab_foreground #ffffff
active_tab_background #6c5ce7
inactive_tab_foreground #b0b0b0
inactive_tab_background #2d3436
tab_bar_background #1e1e1e

# Scrolling
scrollback_lines 10000
scrollback_pager less
wheel_scroll_multiplier 5.0

# Performance
repaint_delay 10
input_delay 3



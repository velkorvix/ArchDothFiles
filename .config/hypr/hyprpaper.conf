# Hyprpaper config
# Wallpapers live in ~/.config/wallpapers (cloned from ArchDothFiles repo)

# Preload makes switching between them instant instead of a visible stall.
preload = /home/smitovski/.config/wallpapers/as.jpg
preload = /home/smitovski/.config/wallpapers/sakura.jpg
preload = /home/smitovski/.config/wallpapers/blue-tree.jpg
preload = /home/smitovski/.config/wallpapers/nigth-mountains.jpg
